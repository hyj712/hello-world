# Streamlit 应用配置（可选文件，删掉也能跑）
# 这里只控制外观，没有任何密钥，可以安全上传到 GitHub

[theme]
base = "dark"                 # 想要浅色就把 dark 改成 light
primaryColor = "#E4574C"      # 主题色：按钮、聊天输入框的边框
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1B1F27"
textColor = "#FAFAFA"

[browser]
gatherUsageStats = false      # 不向 Streamlit 发送使用统计
